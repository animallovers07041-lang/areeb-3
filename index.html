<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPL 2026 Fantasy Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#050816;
overflow:hidden;
padding:20px;
position:relative;
}

body::before{
content:'';
position:absolute;
width:350px;
height:350px;
background:#009dff;
filter:blur(140px);
top:-120px;
left:-100px;
opacity:.45;
}

body::after{
content:'';
position:absolute;
width:350px;
height:350px;
background:#6f00ff;
filter:blur(140px);
bottom:-120px;
right:-100px;
opacity:.45;
}

.container{
width:100%;
max-width:420px;
padding:40px 28px;
border-radius:32px;
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(18px);
text-align:center;
position:relative;
z-index:10;
box-shadow:0 15px 45px rgba(0,0,0,0.45);

display:flex;
flex-direction:column;
align-items:center;
}

.badge{
display:inline-block;
padding:8px 18px;
background:rgba(0,157,255,0.15);
border:1px solid rgba(0,157,255,0.25);
border-radius:50px;
font-size:13px;
margin-bottom:24px;
color:#7fd0ff;
font-weight:500;
}

.logo{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:4px solid rgba(255,255,255,0.15);
box-shadow:0 10px 35px rgba(0,157,255,.4);
margin-bottom:24px;

display:block;
margin-left:auto;
margin-right:auto;
}

h1{
font-size:48px;
font-weight:800;
line-height:1.1;
margin-bottom:14px;
text-align:center;
}

h1 span{
background:linear-gradient(90deg,#00bfff,#7d5cff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

p{
font-size:15px;
line-height:1.8;
color:#d7d7d7;
margin-bottom:32px;
text-align:center;
}

.btn{
display:flex;
justify-content:center;
align-items:center;
gap:10px;

width:100%;
max-width:300px;

padding:16px;
border-radius:18px;

text-decoration:none;
font-size:17px;
font-weight:700;

background:linear-gradient(90deg,#009dff,#005eff);
color:white;

transition:.3s;
box-shadow:0 10px 25px rgba(0,140,255,.35);
}

.btn:hover{
transform:translateY(-4px) scale(1.02);
}

.stats{
display:flex;
justify-content:center;
width:100%;
margin-top:30px;
gap:12px;
}

.box{
flex:1;
padding:14px;
background:rgba(255,255,255,0.04);
border-radius:16px;
border:1px solid rgba(255,255,255,0.06);
}

.box h3{
font-size:20px;
margin-bottom:4px;
}

.box p{
font-size:12px;
margin:0;
color:#aaa;
}

.footer{
margin-top:26px;
font-size:12px;
color:#8a8a8a;
text-align:center;
}

</style>
</head>

<body>

<div class="container">

<div class="badge">
🏏 IPL 2026 Fantasy Hub
</div>

<img 
src="https://i.ibb.co/Kj5qBRgq/IMG-3879.jpg"
alt="IPL Logo"
class="logo"
>

<h1>
IPL <span>2026</span>
</h1>

<p>
Daily fantasy teams, winning predictions,
match updates & premium cricket content.
</p>

<a 
href="https://t.me/+rQtloA-9JetiZmQ1" 
target="_blank" 
class="btn"
>
📢 Join Free Telegram
</a>

<div class="stats">

<div class="box">
<h3>10K+</h3>
<p>Members</p>
</div>

<div class="box">
<h3>Daily</h3>
<p>Tips</p>
</div>

<div class="box">
<h3>Free</h3>
<p>Access</p>
</div>

</div>

<div class="footer">
#IPL2026 • Fantasy Cricket Community
</div>

</div>

</body>
</html>
